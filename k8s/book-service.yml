# Deployment + Service da APLICAÇÃO book-service no GKE.
# Atencao ao EXCHANGE_SERVICE_SERVICE_HOST: sem porta! O @FeignClient usa
# "${EXCHANGE_SERVICE_SERVICE_HOST:http://host.docker.internal}:8000" e ja
# concatena ":8000" sozinho.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: book-service
  labels:
    app: book-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: book-service
  template:
    metadata:
      labels:
        app: book-service
    spec:
      containers:
        - name: book-service
          image: SEU_USUARIO_DOCKERHUB/book-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8100
              name: http
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://book-mysql:3306/book_service"
            - name: SPRING_DATASOURCE_USERNAME
              value: "mysql"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "123456"
            - name: EXCHANGE_SERVICE_SERVICE_HOST
              value: "http://exchange-service"   # SEM :8000 no final (Feign acrescenta)
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: 8100
            initialDelaySeconds: 40
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8100
            initialDelaySeconds: 60
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: book-service
  annotations:
    # Mesma regra do exchange: BackendConfig/app-protocols se associam ao SERVICE.
    cloud.google.com/app-protocols: '{"http":"HTTP"}'
    cloud.google.com/backend-config: '{"ports":{"8100":"book-behc"}}'
spec:
  type: ClusterIP
  selector:
    app: book-service
  ports:
    - name: http
      port: 8100
      targetPort: 8100
