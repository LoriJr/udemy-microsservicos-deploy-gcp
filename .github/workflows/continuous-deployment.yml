name: Microservices Continuous Deployment

on:
  push:
    branches:
    - "main"
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{secrets.DOCKER_USERNAME}}
        password: ${{secrets.DOCKER_ACCESS_TOKEN}}

    - name: Setup Java 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: temurin        
    - run: java --version

    - name: Build Book-Service
      working-directory: ./book-service
      run: mvn clean package

    - name: Build Exchange-Service
      working-directory: ./exchange-service
      run: mvn clean package

    - name: Docker Compose Build
      working-directory: ./
      run: docker compose build

    - name: Tag Docker Images
      run: |        
        docker tag book-service:0.0.1-SNAPSHOT ${{secrets.DOCKER_USERNAME}}/book-service:latest
        docker tag book-service:0.0.1-SNAPSHOT ${{secrets.DOCKER_USERNAME}}/book-service:kube-v1
        docker tag exchange-service:0.0.1-SNAPSHOT ${{secrets.DOCKER_USERNAME}}/exchange-service:latest
        docker tag exchange-service:0.0.1-SNAPSHOT ${{secrets.DOCKER_USERNAME}}/exchange-service:kube-v1


    - name: Push Docker Images to Docker Hub
      run: |
        docker push ${{secrets.DOCKER_USERNAME}}/book-service:latest
        docker push ${{secrets.DOCKER_USERNAME}}/book-service:kube-v1
        docker push ${{secrets.DOCKER_USERNAME}}/exchange-service:latest
        docker push ${{secrets.DOCKER_USERNAME}}/exchange-service:kube-v1

    